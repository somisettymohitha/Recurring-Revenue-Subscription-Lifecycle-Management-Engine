spring.application.name=apigateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================
# USER SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# =========================
# PAYMENT SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[1].id=paymentservice
spring.cloud.gateway.server.webflux.routes[1].uri=lb://paymentservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/payments/**

# =========================
# SUBSCRIPTION SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[2].id=subscriptionservice
spring.cloud.gateway.server.webflux.routes[2].uri=lb://subscriptionservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/subscriptions/**

# =========================
# JWT SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[3].id=jwtcreation
spring.cloud.gateway.server.webflux.routes[3].uri=lb://jwtcreation
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/**